apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: class-9

resources:
- ../../base
- configmap.yaml

patches:
- path: patch-deployment.yaml
  target:
    kind: Deployment
    name: sk304-myfirst-api-server

# 이미지 tag만 갱신하고 싶을 때 (standalone kustomize CLI 필요):
#   cd kustomize/dev && kustomize edit set image \
#     skala-registry.skala-ai.com/class-9/sk304-webserver=skala-registry.skala-ai.com/class-9/sk304-webserver:<NEW_TAG>
images:
- name: skala-registry.skala-ai.com/class-9/sk304-webserver
  newName: skala-registry.skala-ai.com/class-9/sk304-webserver
  newTag: 1.0-docker-sk304-poll-1-9e5a54f
